name: Deploy

# Publishes the built SPA and the catalog, and nothing else. Infrastructure —
# including the auth Lambda's code, which Terraform owns — is applied by hand
# from a laptop. No workflow in this repository runs Terraform.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'content/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# id-token is what lets the job request an OIDC token to trade for AWS
# credentials. Without it the assume-role step fails.
permissions:
  contents: read
  id-token: write

# Never let two deploys race to the same bucket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to S3 and CloudFront
    runs-on: ubuntu-latest

    # NOTE: adding `environment: <name>` here changes the OIDC token's `sub`
    # claim from `repo:OWNER/REPO:ref:refs/heads/master` to
    # `repo:OWNER/REPO:environment:<name>`, which the role's trust policy would
    # then reject. If you want an approval gate, add the environment here AND
    # add its name to `github_environments` in terraform.tfvars — both, or the
    # assume-role step fails.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: watcher-deploy-${{ github.run_id }}

      # Hashed filenames change on every build, so these can cache forever.
      - name: Upload hashed assets
        run: |
          aws s3 sync web/dist "s3://${{ vars.APP_BUCKET_NAME }}" \
            --delete \
            --exclude 'index.html' \
            --cache-control 'public, max-age=31536000, immutable'

      # index.html names the hashed bundles, so it must always be revalidated —
      # otherwise a deploy stays invisible until the edge TTL lapses.
      - name: Upload the app shell
        run: |
          aws s3 cp web/dist/index.html "s3://${{ vars.APP_BUCKET_NAME }}/index.html" \
            --cache-control 'no-cache, must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      - name: Publish the catalog
        run: |
          aws s3 cp content/catalog.json \
            "s3://${{ vars.MEDIA_BUCKET_NAME }}/media/catalog.json" \
            --cache-control 'public, max-age=60' \
            --content-type 'application/json; charset=utf-8'

      # Artwork is immutable; a re-render gets a new path.
      - name: Publish artwork
        run: |
          aws s3 sync content/media \
            "s3://${{ vars.MEDIA_BUCKET_NAME }}/media" \
            --cache-control 'public, max-age=31536000, immutable'

      # Only the two mutable paths, which keeps deploys inside the free tier.
      - name: Invalidate the shell and catalog
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/index.html' '/' '/media/catalog.json' \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for $INVALIDATION_ID…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$INVALIDATION_ID"

      - name: Summary
        run: echo "Deployed to ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"

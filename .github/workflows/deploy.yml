name: Deploy

# One pipeline, in dependency order: Terraform builds or updates the stack,
# then the app is published into the buckets it just created. The app job reads
# the bucket names and the distribution id straight from Terraform's outputs,
# so there is nothing to keep in sync by hand and no repository variables to
# set.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Two applies against one state file would fight over the lock, and two syncs
# would race on the same bucket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Static credentials from repository secrets. Both jobs authenticate the same
# way: Terraform's AWS provider and the AWS CLI read these variable names
# directly, so no configure-aws-credentials step is needed.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1

jobs:
  terraform:
    name: Apply infrastructure
    runs-on: ubuntu-latest

    # Everything the app job needs in order to publish, taken from the stack
    # that was just applied.
    outputs:
      app_bucket: ${{ steps.output.outputs.app_bucket }}
      media_bucket: ${{ steps.output.outputs.media_bucket }}
      distribution_id: ${{ steps.output.outputs.distribution_id }}
      app_url: ${{ steps.output.outputs.app_url }}
      edge: ${{ steps.output.outputs.edge }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          # The wrapper rewrites stdout, which would corrupt `output -raw`.
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: deploy-aws

      - name: Init
        run: terraform init -input=false
        working-directory: deploy-aws

      - name: Validate
        run: terraform validate
        working-directory: deploy-aws

      # terraform.tfvars is tracked and loads automatically, which is where the
      # viewer roster comes from. ci.tfvars then overrides aws_profile to null,
      # since a runner has no ~/.aws/config. TF_VAR_users is the fallback for
      # when the roster is not in git: environment variables sit below tfvars
      # files in precedence, so it is ignored whenever that file sets users.
      - name: Apply
        run: terraform apply -auto-approve -input=false -var-file=ci.tfvars
        working-directory: deploy-aws
        env:
          TF_VAR_users: ${{ secrets.TF_VAR_USERS }}

      - name: Collect outputs
        id: output
        working-directory: deploy-aws
        run: |
          set -euo pipefail
          {
            echo "app_bucket=$(terraform output -raw app_bucket_name)"
            echo "media_bucket=$(terraform output -raw media_bucket_name)"
            echo "distribution_id=$(terraform output -raw distribution_id)"
            echo "app_url=$(terraform output -raw app_url)"
            echo "edge=$(terraform output -raw edge)"
          } >> "$GITHUB_OUTPUT"

  app:
    name: Publish the app
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web app
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # Hashed filenames change on every build, so these can cache forever.
      - name: Upload hashed assets
        run: |
          aws s3 sync web/dist "s3://${{ needs.terraform.outputs.app_bucket }}" \
            --delete \
            --exclude 'index.html' \
            --cache-control 'public, max-age=31536000, immutable'

      # index.html names the hashed bundles, so it must always be revalidated —
      # otherwise a deploy stays invisible until the edge TTL lapses.
      - name: Upload the app shell
        run: |
          aws s3 cp web/dist/index.html \
            "s3://${{ needs.terraform.outputs.app_bucket }}/index.html" \
            --cache-control 'no-cache, must-revalidate' \
            --content-type 'text/html; charset=utf-8'

      # Seeded, not published. The catalog is edited from the dashboard now, so
      # copying it on every deploy would silently revert whatever an admin did.
      # It is only written when the library has no catalog at all.
      - name: Seed the catalog if the library is empty
        run: |
          set -euo pipefail
          BUCKET="${{ needs.terraform.outputs.media_bucket }}"
          if aws s3api head-object --bucket "$BUCKET" --key 'media/catalog.json' >/dev/null 2>&1; then
            echo "Catalog already exists; leaving it alone."
          else
            echo "No catalog yet; seeding from the repository."
            aws s3 cp content/catalog.json "s3://$BUCKET/media/catalog.json" \
              --cache-control 'public, max-age=30' \
              --content-type 'application/json; charset=utf-8'
          fi

      # Artwork is immutable; a re-render gets a new path.
      - name: Publish artwork
        run: |
          aws s3 sync content/media \
            "s3://${{ needs.terraform.outputs.media_bucket }}/media" \
            --cache-control 'public, max-age=31536000, immutable'

      # Only the two mutable paths, which keeps deploys inside the free tier.
      # Skipped behind API Gateway: there is no edge cache to invalidate, so
      # an upload is live the moment it lands.
      - name: Invalidate the shell and catalog
        if: needs.terraform.outputs.distribution_id != ''
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ needs.terraform.outputs.distribution_id }}" \
            --paths '/index.html' '/' '/media/catalog.json' \
            --query 'Invalidation.Id' --output text)
          echo "Waiting for $INVALIDATION_ID…"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ needs.terraform.outputs.distribution_id }}" \
            --id "$INVALIDATION_ID"

      # Proves the deploy actually serves, rather than that the upload
      # succeeded. Each check is one property of the front end, so a failure
      # names which one broke.
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          BASE="${{ needs.terraform.outputs.app_url }}"

          # curl's own exit code is captured rather than allowed to abort the
          # script, so a transport failure is reported as that, and an
          # unexpected status is reported as the status it actually got.
          failures=0
          check() {
            local name="$1" expected="$2" url="$3"
            shift 3
            local actual rc
            actual=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$@" "$url") && rc=0 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "FAIL  $name: curl exited $rc  ($url)"
              failures=$((failures + 1))
              return 0
            fi
            if [ "$actual" != "$expected" ]; then
              echo "FAIL  $name: wanted $expected, got $actual  ($url)"
              failures=$((failures + 1))
              return 0
            fi
            echo "ok    $name ($expected)"
          }

          # The shell, and a client-side route that has no object behind it.
          check "app shell"        200 "$BASE/"
          check "spa routing"      200 "$BASE/watch/harmonic-foundations"
          check "hashed asset 404" 404 "$BASE/assets/does-not-exist.js"

          # The gate. Signed out, media must not come back.
          check "media is gated"   403 "$BASE/media/catalog.json"

          # The auth API, reachable and still rejecting bad credentials.
          check "api health"       200 "$BASE/api/health"
          check "bad login"        401 "$BASE/api/login" \
            -X POST -H 'content-type: application/json' \
            --data '{"username":"nobody","password":"wrong"}'

          if [ "$failures" -ne 0 ]; then
            echo "$failures smoke check(s) failed against $BASE"
            exit 1
          fi
          echo "All smoke checks passed against $BASE"

      - name: Summary
        run: |
          {
            echo "Deployed to ${{ needs.terraform.outputs.app_url }}"
            echo ""
            echo "Front end: \`${{ needs.terraform.outputs.edge }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

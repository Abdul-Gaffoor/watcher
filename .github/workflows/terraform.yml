name: Terraform

# Infrastructure changes, including the auth Lambda's code — Terraform owns the
# function package, so a backend change ships through here, not deploy.yml.
on:
  pull_request:
    paths:
      - 'deploy-aws/**'
      - 'backend/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'deploy-aws/**'
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: deploy-aws

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Assume the terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: watcher-tf-plan-${{ github.run_id }}

      - run: terraform init -input=false

      - run: terraform fmt -check -recursive

      - name: Plan
        id: plan
        # TF_VAR_users carries password hashes; keep it in a secret, not a var.
        env:
          TF_VAR_users: ${{ secrets.TF_VAR_USERS }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            let plan = execSync('terraform show -no-color tfplan', { cwd: 'deploy-aws' }).toString();
            // Keep well under GitHub's 65536-character comment limit.
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n… truncated, see the job log.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: ['### Terraform plan', '```terraform', plan, '```'].join('\n'),
            });

  apply:
    name: Apply
    # Only from main, and only after a successful plan.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Assume the terraform role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: watcher-tf-apply-${{ github.run_id }}

      - run: terraform init -input=false

      # Re-planned here rather than reusing the artifact from the plan job: the
      # role session differs, and the window between jobs can change state.
      - name: Apply
        env:
          TF_VAR_users: ${{ secrets.TF_VAR_USERS }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
        run: terraform apply -input=false -auto-approve
